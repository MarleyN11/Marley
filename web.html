<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DarkChat</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f172a;color:#fff;height:100vh;overflow:hidden}
input{width:100%;padding:10px;border:none;border-radius:10px;background:#334155;color:#fff}
button{
background:linear-gradient(135deg,#2563eb,#3b82f6);
color:#fff;border:none;border-radius:10px;padding:10px 14px;
cursor:pointer;transition:.2s;font-weight:bold
}
button:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 8px 20px rgba(59,130,246,.4)}
button:active{transform:scale(.96)}

#auth{display:flex;justify-content:center;align-items:center;height:100vh}
.card{width:390px;background:#1e293b;padding:25px;border-radius:20px}
.card h1{text-align:center;margin-bottom:15px}
.switch{text-align:center;font-size:13px;margin-top:12px;color:#94a3b8;cursor:pointer}

#app{display:none;height:100vh}
.top{height:60px;background:#020617;display:flex;justify-content:space-between;align-items:center;padding:0 20px}
.main{display:flex;height:calc(100vh - 60px)}
.side{width:280px;background:#111827;padding:15px;overflow:auto}
.chat{flex:1;display:flex;flex-direction:column}
#messages{flex:1;padding:15px;overflow:auto;background:#0b1220}
.msg{background:#374151;padding:10px;border-radius:12px;margin:8px 0;max-width:420px;animation:pop .2s}
.me{background:#2563eb;margin-left:auto}
.sys{background:#475569}
.send{display:flex;gap:10px;padding:15px;background:#111827}
.send input{flex:1}
.friend,.req{
background:#1f2937;padding:10px;border-radius:10px;
margin-top:8px;display:flex;justify-content:space-between;align-items:center;
transition:.2s
}
.friend:hover,.req:hover{background:#334155;transform:translateX(4px)}
.small{font-size:12px;color:#94a3b8}
.active{outline:2px solid #3b82f6}
#adminPanel{display:none;margin-top:20px;border-top:1px solid #334155;padding-top:15px}
.userBox{background:#1f2937;padding:10px;border-radius:10px;margin-top:8px}
.actions{display:flex;gap:5px;margin-top:8px}
.actions button{flex:1;padding:6px;font-size:11px}
@keyframes pop{
from{opacity:0;transform:translateY(10px)}
to{opacity:1;transform:translateY(0)}
}
</style>
</head>
<body>

<div id="auth">
<div class="card">

<h1>💬 DarkChat</h1>

<div id="loginBox">
<input id="loginUser" placeholder="Benutzername"><br><br>
<input id="loginPass" type="password" placeholder="Passwort"><br><br>
<button style="width:100%" onclick="login()">Einloggen</button>
<div class="switch" onclick="showRegister()">Registrieren</div>
</div>

<div id="registerBox" style="display:none">
<input id="regUser" placeholder="Benutzername"><br><br>
<input id="regPass" type="password" placeholder="Passwort"><br><br>
<button style="width:100%;background:#16a34a" onclick="register()">Konto erstellen</button>
<div class="switch" onclick="showLogin()">Zurück zum Login</div>
</div>

</div>
</div>

<div id="app">

<div class="top">
<b id="me"></b>
<b id="roomTitle">🌍 Allgemein</b>
</div>

<div class="main">

<div class="side">

<h3>Chats</h3>

<div class="friend active" onclick="openGeneral()">
<span>🌍 Allgemein</span>
</div>

<div id="privateChats"></div>

<h3 style="margin-top:18px">Freunde</h3>
<div id="friends"></div>

<h3 style="margin-top:18px">Freund hinzufügen</h3>
<input id="addFriendName" placeholder="Username">
<button style="width:100%;margin-top:8px" onclick="sendRequest()">Senden</button>

<h3 style="margin-top:18px">Anfragen</h3>
<div id="requests"></div>

<div id="adminPanel">
<h3>🛡 Admin Panel</h3>
<div id="adminUsers"></div>
</div>

</div>

<div class="chat">

<div id="messages"></div>

<div class="send">
<input id="text" placeholder="Nachricht schreiben...">
<button onclick="send()">Senden</button>
</div>

</div>

</div>

</div>

<script>
const ADMIN="Marley";
const ADMINPASS="Marley123!?";
const bc=new BroadcastChannel("darkchat");

let me="";
let isAdmin=false;
let room="general";

function db(key,def){
return JSON.parse(localStorage.getItem(key)||JSON.stringify(def));
}

function save(key,val){
localStorage.setItem(key,JSON.stringify(val));
}

function showRegister(){
loginBox.style.display="none";
registerBox.style.display="block";
}

function showLogin(){
registerBox.style.display="none";
loginBox.style.display="block";
}

function register(){
let users=db("users",{});
let u=regUser.value.trim();
let p=regPass.value;

if(!u||!p)return alert("Alles ausfüllen");
if(users[u]||u===ADMIN)return alert("Username existiert");

users[u]=p;
save("users",users);

alert("Konto erstellt!");
showLogin();
}

function login(){

let u=loginUser.value.trim();
let p=loginPass.value;

if(!u||!p)return;

if(db("banned",[]).includes(u)){
alert("Du bist gebannt.");
return;
}

if(u===ADMIN&&p===ADMINPASS){
isAdmin=true;
}else{
let users=db("users",{});
if(users[u]!==p){
alert("Falscher Login");
return;
}
}

me=u;

auth.style.display="none";
app.style.display="block";

document.getElementById("me").innerText=me;

renderAll();

bc.postMessage({type:"refresh"});
}

function renderAll(){
renderFriends();
renderRequests();
renderPrivateChats();
if(isAdmin){
adminPanel.style.display="block";
renderAdmin();
}
loadMessages();
}

function renderFriends(){

let list=db("friends_"+me,[]);
friends.innerHTML="";

if(list.length===0){
friends.innerHTML="<div class='small'>Keine Freunde</div>";
return;
}

list.forEach(f=>{
friends.innerHTML+=`
<div class="friend">
<span>${f}</span>
<button onclick="openPrivate('${f}')">Chat</button>
</div>`;
});

}

function renderPrivateChats(){

let list=db("friends_"+me,[]);
privateChats.innerHTML="";

list.forEach(f=>{
privateChats.innerHTML+=`
<div class="friend" onclick="openPrivate('${f}')">
<span>💬 ${f}</span>
</div>`;
});

}

function sendRequest(){

let name=addFriendName.value.trim();

if(!name||name===me)return;

let users=db("users",{});

if(name!==ADMIN&&!users[name]){
alert("Benutzer nicht gefunden");
return;
}

let req=db("req_"+name,[]);

if(!req.includes(me)){
req.push(me);
save("req_"+name,req);
}

alert("Anfrage gesendet");
addFriendName.value="";
}

function renderRequests(){

let req=db("req_"+me,[]);
requests.innerHTML="";

if(req.length===0){
requests.innerHTML="<div class='small'>Keine Anfragen</div>";
return;
}

req.forEach(u=>{
requests.innerHTML+=`
<div class="req">
<span>${u}</span>
<button onclick="accept('${u}')">✔</button>
</div>`;
});

}

function accept(name){

let my=db("friends_"+me,[]);
let his=db("friends_"+name,[]);

if(!my.includes(name))my.push(name);
if(!his.includes(me))his.push(me);

save("friends_"+me,my);
save("friends_"+name,his);

let req=db("req_"+me,[]).filter(x=>x!==name);
save("req_"+me,req);

renderAll();
}

function roomKey(){
if(room==="general")return"chat_general";
return"chat_"+room;
}

function openGeneral(){
room="general";
roomTitle.innerText="🌍 Allgemein";
loadMessages();
}

function openPrivate(friend){

room=[me,friend].sort().join("|");
roomTitle.innerText="💬 "+friend;

loadMessages();
}

function loadMessages(){

messages.innerHTML="";

let arr=[];

if(isAdmin){
arr=[];

Object.keys(localStorage).forEach(k=>{
if(k.startsWith("chat_")){
arr=arr.concat(db(k,[]));
}
});

arr.sort((a,b)=>a.time-b.time);

}else{

arr=db(roomKey(),[]);

}

arr.forEach(m=>{

let cls="msg";

if(m.user===me)cls+=" me";
if(m.sys)cls+=" sys";

messages.innerHTML+=`
<div class="${cls}">
<b>${m.user}</b><br>
${m.text}
</div>`;

});

messages.scrollTop=messages.scrollHeight;

}

function send(){

if(db("muted",[]).includes(me)){
alert("Du bist gemutet.");
return;
}

let txt=text.value.trim();

if(!txt)return;

let arr=db(roomKey(),[]);

arr.push({
user:me,
text:txt,
time:Date.now()
});

save(roomKey(),arr);

text.value="";

loadMessages();

bc.postMessage({type:"refresh"});
}

function renderAdmin(){

let users=db("users",{});
adminUsers.innerHTML="";

let names=[ADMIN,...Object.keys(users)];

names.forEach(name=>{

let banned=db("banned",[]);
let muted=db("muted",[]);

adminUsers.innerHTML+=`
<div class="userBox">
<b>${name}</b><br>
<span class="small">
${banned.includes(name)?"🚫 Gebannt":muted.includes(name)?"🔇 Gemutet":"🟢 Aktiv"}
</span>

<div class="actions">
<button onclick="muteUser('${name}')">Mute</button>
<button onclick="banUser('${name}')">Ban</button>
<button onclick="deleteUser('${name}')">Löschen</button>
</div>
</div>`;

});

}

function muteUser(name){

if(name===ADMIN)return;

let m=db("muted",[]);

if(m.includes(name)){
m=m.filter(x=>x!==name);
}else{
m.push(name);
}

save("muted",m);
renderAdmin();
}

function banUser(name){

if(name===ADMIN)return;

let b=db("banned",[]);

if(b.includes(name)){
b=b.filter(x=>x!==name);
}else{
b.push(name);
}

save("banned",b);
renderAdmin();
}

function deleteUser(name){

if(name===ADMIN){
alert("Admin kann nicht gelöscht werden.");
return;
}

let users=db("users",{});

delete users[name];

save("users",users);

localStorage.removeItem("friends_"+name);
localStorage.removeItem("req_"+name);

Object.keys(localStorage).forEach(k=>{
if(k.includes(name)&&k.startsWith("chat_")){
localStorage.removeItem(k);
}
});

renderAdmin();
}

bc.onmessage=e=>{
if(e.data.type==="refresh"){
loadMessages();
renderFriends();
renderRequests();
renderPrivateChats();
if(isAdmin)renderAdmin();
}
};

text.addEventListener("keydown",e=>{
if(e.key==="Enter")send();
});
</script>

</body>
</html>
