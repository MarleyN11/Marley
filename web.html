<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schicke mir eine anonyme Nachricht</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
    margin:0;
    padding:20px;
}

.container{
    background:white;
    padding:30px;
    border-radius:20px;
    width:90%;
    max-width:500px;
    margin:30px auto;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h1,h2{
    text-align:center;
}

p{
    color:#666;
}

textarea{
    width:100%;
    height:150px;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    resize:none;
    margin-top:15px;
}

button{
    width:100%;
    margin-top:15px;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#667eea;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#5568d8;
}

.footer-link{
    text-align:center;
    margin-top:20px;
}

.footer-link a{
    color:#666;
    text-decoration:none;
}

.footer-link a:hover{
    text-decoration:underline;
}

.impressum{
    background:white;
    padding:30px;
    border-radius:20px;
    width:90%;
    max-width:700px;
    margin:30px auto;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}
</style>
</head>
<body>

<div class="container">
    <h1>📩 Anonyme Nachricht</h1>
    <p>Schicke mir eine Nachricht. Dein Name wird nicht abgefragt.</p>

    <form action="https://formspree.io/f/mbdejbjl" method="POST">
        <textarea
            name="message"
            placeholder="Made by marley..."
            required></textarea>

        <button type="submit">Nachricht senden</button>
    </form>

    <div class="footer-link">
        <a href="#impressum">Impressum</a>
    </div>
</div>

<div class="impressum" id="impressum">
    <h2>Impressum</h2>

    </p>

    <p>
        E-Mail: marley.neul@gmx.de
    </p>

    <p>
        Verantwortlich für den Inhalt:<br>
        Marley Neul
    </p>
</div>

</body>
</html>
